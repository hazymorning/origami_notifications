name: Bug report
description: Something in the card is broken or works differently than the readme says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Questions and ideas go to [Discussions](https://github.com/hazymorning/origami_notifications/discussions).

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I use the latest release and reloaded the page with a cleared cache.
          required: true
        - label: I searched the open and closed issues.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Screenshots or a screen recording help a lot.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Card configuration
      description: The YAML from the card's code editor.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: entity
    attributes:
      label: Entity state and attributes
      description: From Developer tools > States, if the bug is about one entity.
      render: yaml

  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Card 0.4.0, Home Assistant 2026.10.0
    validations:
      required: true

  - type: dropdown
    id: view
    attributes:
      label: Dashboard view
      options:
        - Sections
        - Sections, in the view footer
        - Masonry
        - Panel or sidebar
        - Inside a stack or another card
        - Other
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Browser or app
      placeholder: Firefox on Windows, Companion app on iOS
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      render: text
