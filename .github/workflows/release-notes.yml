name: Release notes

on:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name and notes
        env:
          NAME: ${{ github.event.release.name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          printf '%s' "$NAME" | python3 scripts/text-style.py --stdin name --limit 72
          printf '%s' "$NOTES" | python3 scripts/text-style.py --stdin notes --limit 3000
