name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$TITLE" | python3 scripts/text-style.py --stdin title --limit 72
          printf '%s' "$BODY" | python3 scripts/text-style.py --stdin body --limit 1200

      - name: One open pull request at a time
        if: github.event.pull_request.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "$GITHUB_REPOSITORY_OWNER" --json number --jq length)
          if [ "$open" -gt 1 ]; then
            echo "$open pull requests are open. Finish one first." >&2
            exit 1
          fi
